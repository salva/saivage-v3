name: Validation profiles

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      run_full_sweep:
        description: 'Run all path-aware validation jobs and the release-style sweep'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
  schedule:
    - cron: '17 5 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify-changes:
    name: classify-changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.classify.outputs.backend }}
      ui: ${{ steps.classify.outputs.ui }}
      browser: ${{ steps.classify.outputs.browser }}
      docs_only: ${{ steps.classify.outputs.docs_only }}
      package_or_workflow: ${{ steps.classify.outputs.package_or_workflow }}
      run_all: ${{ steps.classify.outputs.run_all }}
      summary: ${{ steps.classify.outputs.summary }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: classify
        shell: bash
        run: |
          set -euo pipefail

          backend=false
          ui=false
          browser=false
          docs_only=false
          package_or_workflow=false
          run_all=false
          summary='changed-file classification completed'

          fail_closed() {
            run_all=true
            docs_only=false
            summary="fail-closed: $1"
          }

          classify_file() {
            local file="$1"
            local docs_like=false

            case "$file" in
              docs/*|architecture-audit/*|audit-findings/*|ui-findings/*|*.md|README.md|EADME.md)
                docs_like=true
                ;;
            esac

            case "$file" in
              package.json|package-lock.json|web/package.json|web/package-lock.json|.github/workflows/*)
                package_or_workflow=true
                ;;
            esac

            case "$file" in
              .github/workflows/*)
                run_all=true
                ;;
            esac

            case "$file" in
              src/contracts/*)
                backend=true
                ui=true
                browser=true
                ;;
              src/*|src/**/*|bin/*|bin/**/*|scripts/*|scripts/**/*|tests/*|tests/**/*|jest.config.*|tsconfig*.json)
                if [[ "$file" != tests/playwright/* ]]; then
                  backend=true
                fi
                ;;
            esac

            case "$file" in
              web/*|web/**/*|tests/playwright/*|tests/playwright/**/*)
                ui=true
                browser=true
                ;;
            esac

            if [[ "$docs_like" != true ]]; then
              docs_only=false
              return 0
            fi
          }

          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            run_all=true
            docs_only=false
            summary='scheduled full-release backstop: run_all=true'
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ "${{ inputs.run_full_sweep }}" == "false" ]]; then
              fail_closed 'manual dispatch has no reliable changed-file base; running all jobs'
            else
              run_all=true
              docs_only=false
              summary='manual full sweep requested: run_all=true'
            fi
          else
            base=''
            head='${{ github.sha }}'
            if [[ "${{ github.event_name }}" == "pull_request" ]]; then
              base='${{ github.event.pull_request.base.sha }}'
              head='${{ github.event.pull_request.head.sha }}'
            elif [[ "${{ github.event_name }}" == "push" ]]; then
              base='${{ github.event.before }}'
              if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
                fail_closed 'push base SHA unavailable'
              fi
            fi

            if [[ "$run_all" != true ]]; then
              if [[ -z "$base" || -z "$head" ]]; then
                fail_closed 'base or head SHA unavailable'
              elif ! git cat-file -e "$base^{commit}" 2>/dev/null || ! git cat-file -e "$head^{commit}" 2>/dev/null; then
                fail_closed 'base or head commit unavailable after checkout'
              elif ! git diff --name-only "$base" "$head" > changed-files.txt; then
                fail_closed 'git diff failed'
              else
                if [[ ! -s changed-files.txt ]]; then
                  docs_only=true
                  summary='no changed files detected; routine/docs only'
                else
                  docs_only=true
                  while IFS= read -r changed_file; do
                    [[ -z "$changed_file" ]] && continue
                    classify_file "$changed_file"
                  done < changed-files.txt
                  summary="classified $(wc -l < changed-files.txt | tr -d ' ') changed file(s)"
                fi
              fi
            fi
          fi

          if [[ "$run_all" == true ]]; then
            backend=true
            ui=true
            browser=true
            package_or_workflow=true
            docs_only=false
          elif [[ "$package_or_workflow" == true ]]; then
            backend=true
            ui=true
            browser=true
          fi

          {
            echo "backend=$backend"
            echo "ui=$ui"
            echo "browser=$browser"
            echo "docs_only=$docs_only"
            echo "package_or_workflow=$package_or_workflow"
            echo "run_all=$run_all"
            echo "summary=$summary"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Validation path classification"
            echo "- summary: $summary"
            echo "- backend: $backend"
            echo "- ui: $ui"
            echo "- browser: $browser"
            echo "- docs_only: $docs_only"
            echo "- package_or_workflow: $package_or_workflow"
            echo "- run_all: $run_all"
            if [[ -f changed-files.txt ]]; then
              echo ""
              echo "Changed files:"
              sed 's/^/- /' changed-files.txt
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  routine-docs:
    name: routine-docs
    runs-on: ubuntu-latest
    needs: classify-changes
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Routine validation profile
        run: npm run validate:routine

      - name: Documentation validation profile
        run: npm run validate:docs

  backend-jest-build:
    name: backend-jest-build
    runs-on: ubuntu-latest
    needs: classify-changes
    if: ${{ needs.classify-changes.outputs.run_all == 'true' || needs.classify-changes.outputs.backend == 'true' || needs.classify-changes.outputs.package_or_workflow == 'true' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Full Jest suite
        run: npm test

  ui-smoke:
    name: ui-smoke
    runs-on: ubuntu-latest
    needs: classify-changes
    if: ${{ needs.classify-changes.outputs.run_all == 'true' || needs.classify-changes.outputs.ui == 'true' || needs.classify-changes.outputs.browser == 'true' || needs.classify-changes.outputs.package_or_workflow == 'true' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: UI smoke validation profile
        run: npm run validate:ui-smoke

  browser-smoke:
    name: browser-smoke
    runs-on: ubuntu-latest
    needs: classify-changes
    if: ${{ github.event_name != 'schedule' && (needs.classify-changes.outputs.run_all == 'true' || needs.classify-changes.outputs.browser == 'true' || needs.classify-changes.outputs.package_or_workflow == 'true') }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium browser
        run: npm run web:test:e2e:install

      - name: Install Chromium host dependencies
        run: npx playwright install-deps chromium

      - name: Browser smoke validation profile
        run: npm run web:test:e2e:smoke

  scheduled-release-backstop:
    name: scheduled-release-backstop
    runs-on: ubuntu-latest
    needs: classify-changes
    if: ${{ github.event_name == 'schedule' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Release validation profile
        run: npm run validate:release

      - name: Install Chromium browser
        run: npm run web:test:e2e:install

      - name: Install Chromium host dependencies
        run: npx playwright install-deps chromium

      - name: Scheduled browser smoke validation profile
        run: npm run web:test:e2e:smoke

  validation-required:
    name: validation-required
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs:
      - classify-changes
      - routine-docs
      - backend-jest-build
      - ui-smoke
      - browser-smoke
      - scheduled-release-backstop
    steps:
      - name: Enforce required validation conclusions
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          CLASSIFIER_RESULT: ${{ needs.classify-changes.result }}
          ROUTINE_RESULT: ${{ needs.routine-docs.result }}
          BACKEND_RESULT: ${{ needs.backend-jest-build.result }}
          UI_RESULT: ${{ needs.ui-smoke.result }}
          BROWSER_RESULT: ${{ needs.browser-smoke.result }}
          SCHEDULED_RESULT: ${{ needs.scheduled-release-backstop.result }}
          BACKEND_APPLIES: ${{ needs.classify-changes.outputs.run_all == 'true' || needs.classify-changes.outputs.backend == 'true' || needs.classify-changes.outputs.package_or_workflow == 'true' }}
          UI_APPLIES: ${{ needs.classify-changes.outputs.run_all == 'true' || needs.classify-changes.outputs.ui == 'true' || needs.classify-changes.outputs.browser == 'true' || needs.classify-changes.outputs.package_or_workflow == 'true' }}
          BROWSER_APPLIES: ${{ github.event_name != 'schedule' && (needs.classify-changes.outputs.run_all == 'true' || needs.classify-changes.outputs.browser == 'true' || needs.classify-changes.outputs.package_or_workflow == 'true') }}
          SCHEDULED_APPLIES: ${{ github.event_name == 'schedule' }}
          CLASSIFIER_SUMMARY: ${{ needs.classify-changes.outputs.summary }}
        run: |
          set -euo pipefail
          failures=()

          require_success() {
            local name="$1"
            local result="$2"
            if [[ "$result" != success ]]; then
              failures+=("$name expected success but concluded '$result'")
            fi
          }

          require_applicable() {
            local name="$1"
            local applies="$2"
            local result="$3"
            if [[ "$applies" == true ]]; then
              if [[ "$result" != success ]]; then
                failures+=("$name applies but concluded '$result'")
              fi
            else
              if [[ "$result" != skipped ]]; then
                failures+=("$name should be intentionally skipped but concluded '$result'")
              fi
            fi
          }

          require_success classify-changes "$CLASSIFIER_RESULT"
          require_success routine-docs "$ROUTINE_RESULT"
          require_applicable backend-jest-build "$BACKEND_APPLIES" "$BACKEND_RESULT"
          require_applicable ui-smoke "$UI_APPLIES" "$UI_RESULT"
          require_applicable browser-smoke "$BROWSER_APPLIES" "$BROWSER_RESULT"
          require_applicable scheduled-release-backstop "$SCHEDULED_APPLIES" "$SCHEDULED_RESULT"

          {
            echo "### Required validation aggregate"
            echo "- classifier: $CLASSIFIER_RESULT ($CLASSIFIER_SUMMARY)"
            echo "- routine-docs: $ROUTINE_RESULT"
            echo "- backend-jest-build: $BACKEND_RESULT (applies=$BACKEND_APPLIES)"
            echo "- ui-smoke: $UI_RESULT (applies=$UI_APPLIES)"
            echo "- browser-smoke: $BROWSER_RESULT (applies=$BROWSER_APPLIES)"
            echo "- scheduled-release-backstop: $SCHEDULED_RESULT (applies=$SCHEDULED_APPLIES)"
          } >> "$GITHUB_STEP_SUMMARY"

          if ((${#failures[@]} > 0)); then
            printf 'Validation aggregate failed:\n' >&2
            printf -- '- %s\n' "${failures[@]}" >&2
            exit 1
          fi

          echo 'validation-required passed'
