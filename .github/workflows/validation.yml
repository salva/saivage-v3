name: Validation profiles

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      run_ui_smoke:
        description: 'Also run the lightweight UI/operator smoke profile'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      run_release_profile:
        description: 'Run the heavy release validation profile after routine/docs pass'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Routine validation profile
        run: npm run validate:routine

      - name: Documentation validation profile
        run: npm run validate:docs

      - name: UI smoke validation profile (manual)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_ui_smoke == 'true' }}
        run: npm run validate:ui-smoke

      - name: Release validation profile (manual heavy gate)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_release_profile == 'true' }}
        run: npm run validate:release
