name: Validation profiles

on:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify-changes:
    name: classify-changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.classify.outputs.backend }}
      ui: ${{ steps.classify.outputs.ui }}
      browser: ${{ steps.classify.outputs.browser }}
      docs_only: ${{ steps.classify.outputs.docs_only }}
      package_or_workflow: ${{ steps.classify.outputs.package_or_workflow }}
      run_all: ${{ steps.classify.outputs.run_all }}
      summary: ${{ steps.classify.outputs.summary }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: classify
        shell: bash
        run: |
          set -euo pipefail

          backend=false
          ui=false
          browser=false
          docs_only=false
          package_or_workflow=false
          run_all=false
          summary='changed-file classification completed'

          fail_closed() {
            run_all=true
            docs_only=false
            summary="fail-closed: $1"
          }

          classify_file() {
            local file="$1"
            local docs_like=false

            case "$file" in
              docs/*|architecture-audit/*|audit-findings/*|ui-findings/*|*.md|README.md|EADME.md)
                docs_like=true
                ;;
            esac

            case "$file" in
              package.json|package-lock.json|web/package.json|web/package-lock.json|.github/workflows/*)
                package_or_workflow=true
                ;;
            esac

            case "$file" in
              .github/workflows/*)
                run_all=true
                ;;
            esac

            case "$file" in
              src/contracts/*)
                backend=true
                ui=true
                browser=true
                ;;
              src/*|src/**/*|bin/*|bin/**/*|scripts/*|scripts/**/*|tests/*|tests/**/*|jest.config.*|tsconfig*.json)
                if [[ "$file" != tests/playwright/* ]]; then
                  backend=true
                fi
                ;;
            esac

            case "$file" in
              web/*|web/**/*|tests/playwright/*|tests/playwright/**/*)
                ui=true
                browser=true
                ;;
            esac

            if [[ "$docs_like" != true ]]; then
              docs_only=false
              return 0
            fi
          }

          base='${{ github.event.before }}'
          head='${{ github.sha }}'
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            fail_closed 'push base SHA unavailable'
          fi

          if [[ "$run_all" != true ]]; then
            if [[ -z "$base" || -z "$head" ]]; then
              fail_closed 'base or head SHA unavailable'
            elif ! git cat-file -e "$base^{commit}" 2>/dev/null || ! git cat-file -e "$head^{commit}" 2>/dev/null; then
              fail_closed 'base or head commit unavailable after checkout'
            elif ! git diff --name-only "$base" "$head" > changed-files.txt; then
              fail_closed 'git diff failed'
            else
              if [[ ! -s changed-files.txt ]]; then
                docs_only=true
                summary='no changed files detected; routine/docs only'
              else
                docs_only=true
                while IFS= read -r changed_file; do
                  [[ -z "$changed_file" ]] && continue
                  classify_file "$changed_file"
                done < changed-files.txt
                summary="classified $(wc -l < changed-files.txt | tr -d ' ') changed file(s)"
              fi
            fi
          fi

          if [[ "$run_all" == true ]]; then
            backend=true
            ui=true
            browser=true
            package_or_workflow=true
            docs_only=false
          elif [[ "$package_or_workflow" == true ]]; then
            backend=true
            ui=true
            browser=true
          fi

          {
            echo "backend=$backend"
            echo "ui=$ui"
            echo "browser=$browser"
            echo "docs_only=$docs_only"
            echo "package_or_workflow=$package_or_workflow"
            echo "run_all=$run_all"
            echo "summary=$summary"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Validation path classification"
            echo "- summary: $summary"
            echo "- backend: $backend"
            echo "- ui: $ui"
            echo "- browser: $browser"
            echo "- docs_only: $docs_only"
            echo "- package_or_workflow: $package_or_workflow"
            echo "- run_all: $run_all"
            if [[ -f changed-files.txt ]]; then
              echo ""
              echo "Changed files:"
              sed 's/^/- /' changed-files.txt
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  routine-docs:
    name: routine-docs
    runs-on: ubuntu-latest
    needs: classify-changes
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Routine validation profile
        run: npm run validate:routine

      - name: Documentation validation profile
        run: npm run validate:docs

  backend-jest-build:
    name: backend-jest-build
    runs-on: ubuntu-latest
    needs: classify-changes
    if: ${{ needs.classify-changes.outputs.run_all == 'true' || needs.classify-changes.outputs.backend == 'true' || needs.classify-changes.outputs.package_or_workflow == 'true' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Default Jest suite
        run: npm test

  ui-vitest:
    name: ui-vitest
    runs-on: ubuntu-latest
    needs: classify-changes
    if: ${{ needs.classify-changes.outputs.run_all == 'true' || needs.classify-changes.outputs.ui == 'true' || needs.classify-changes.outputs.browser == 'true' || needs.classify-changes.outputs.package_or_workflow == 'true' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install web dependencies
        run: cd web && npm ci

      - name: Complete UI Vitest suite
        run: npm run web:typecheck && npm run web:test

  browser-smoke:
    name: browser-smoke
    runs-on: ubuntu-latest
    needs: classify-changes
    if: ${{ needs.classify-changes.outputs.run_all == 'true' || needs.classify-changes.outputs.browser == 'true' || needs.classify-changes.outputs.package_or_workflow == 'true' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install web dependencies
        run: cd web && npm ci

      - name: Install Chromium browser
        run: npm run web:test:e2e:install

      - name: Install Chromium host dependencies
        run: npx playwright install-deps chromium

      - name: Browser smoke validation profile
        run: npm run web:test:e2e:smoke

  dependency-hygiene:
    name: dependency-hygiene
    runs-on: ubuntu-latest
    needs: classify-changes
    if: ${{ needs.classify-changes.outputs.run_all == 'true' || needs.classify-changes.outputs.package_or_workflow == 'true' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Install web dependencies
        run: cd web && npm ci

      - name: Production dependency security gate
        run: npm run audit:security

  validation-required:
    name: validation-required
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs:
      - classify-changes
      - routine-docs
      - backend-jest-build
      - ui-vitest
      - browser-smoke
      - dependency-hygiene
    steps:
      - name: Enforce required validation conclusions
        shell: bash
        env:
          CLASSIFIER_RESULT: ${{ needs.classify-changes.result }}
          ROUTINE_RESULT: ${{ needs.routine-docs.result }}
          BACKEND_RESULT: ${{ needs.backend-jest-build.result }}
          UI_RESULT: ${{ needs.ui-vitest.result }}
          BROWSER_RESULT: ${{ needs.browser-smoke.result }}
          DEPENDENCY_RESULT: ${{ needs.dependency-hygiene.result }}
          BACKEND_APPLIES: ${{ needs.classify-changes.outputs.run_all == 'true' || needs.classify-changes.outputs.backend == 'true' || needs.classify-changes.outputs.package_or_workflow == 'true' }}
          UI_APPLIES: ${{ needs.classify-changes.outputs.run_all == 'true' || needs.classify-changes.outputs.ui == 'true' || needs.classify-changes.outputs.browser == 'true' || needs.classify-changes.outputs.package_or_workflow == 'true' }}
          BROWSER_APPLIES: ${{ needs.classify-changes.outputs.run_all == 'true' || needs.classify-changes.outputs.browser == 'true' || needs.classify-changes.outputs.package_or_workflow == 'true' }}
          DEPENDENCY_APPLIES: ${{ needs.classify-changes.outputs.run_all == 'true' || needs.classify-changes.outputs.package_or_workflow == 'true' }}
          CLASSIFIER_SUMMARY: ${{ needs.classify-changes.outputs.summary }}
        run: |
          set -euo pipefail
          failures=()

          require_success() {
            local name="$1"
            local result="$2"
            if [[ "$result" != success ]]; then
              failures+=("$name expected success but concluded '$result'")
            fi
          }

          require_applicable() {
            local name="$1"
            local applies="$2"
            local result="$3"
            if [[ "$applies" == true ]]; then
              if [[ "$result" != success ]]; then
                failures+=("$name applies but concluded '$result'")
              fi
            else
              if [[ "$result" != skipped ]]; then
                failures+=("$name should be intentionally skipped but concluded '$result'")
              fi
            fi
          }

          require_success classify-changes "$CLASSIFIER_RESULT"
          require_success routine-docs "$ROUTINE_RESULT"
          require_applicable backend-jest-build "$BACKEND_APPLIES" "$BACKEND_RESULT"
          require_applicable ui-vitest "$UI_APPLIES" "$UI_RESULT"
          require_applicable browser-smoke "$BROWSER_APPLIES" "$BROWSER_RESULT"
          require_applicable dependency-hygiene "$DEPENDENCY_APPLIES" "$DEPENDENCY_RESULT"

          {
            echo "### Required validation aggregate"
            echo "- classifier: $CLASSIFIER_RESULT ($CLASSIFIER_SUMMARY)"
            echo "- routine-docs: $ROUTINE_RESULT"
            echo "- backend-jest-build: $BACKEND_RESULT (applies=$BACKEND_APPLIES)"
            echo "- ui-vitest: $UI_RESULT (applies=$UI_APPLIES)"
            echo "- browser-smoke: $BROWSER_RESULT (applies=$BROWSER_APPLIES)"
            echo "- dependency-hygiene: $DEPENDENCY_RESULT (applies=$DEPENDENCY_APPLIES)"
          } >> "$GITHUB_STEP_SUMMARY"

          if ((${#failures[@]} > 0)); then
            printf 'Validation aggregate failed:\n' >&2
            printf -- '- %s\n' "${failures[@]}" >&2
            exit 1
          fi

          echo 'validation-required passed'
